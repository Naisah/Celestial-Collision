<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celestial Collision • Entangled Across Windows</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  </head>
  <body>
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top HUD Banner -->
    <div class="hud-header">
      <span class="title">Celestial Collision</span>
      <div class="divider"></div>
      <div class="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">1 Celestial Core (Solo Orbit)</span>
      </div>
    </div>

    <!-- Dynamic Metrics Overlay -->
    <div class="metrics-overlay" id="metrics-overlay">
      <span>DIST: <strong id="dist-val">0</strong> PX</span>
      <span>TENSION: <strong id="tension-val">0</strong> AU</span>
      <span>
        COLLISION ENERGY:
        <span class="collision-bar-wrap">
          <span class="collision-bar-fill" id="collision-bar"></span>
        </span>
      </span>
    </div>

    <!-- Cat Constellation Toast -->
    <div class="cat-toast" id="cat-toast">
      ✨ MEOW! COSMIC CAT CONSTELLATION AWAKENED! 🐱
    </div>

    <!-- Bottom Controls -->
    <div class="hud-footer">
      <div class="controls-row">
        <!-- Palette Color Swatches -->
        <div class="palette-picker" id="palette-picker" title="Change Celestial Core Palette">
          <!-- Dynamically populated -->
        </div>

        <button id="spawn-btn" class="btn btn-primary" title="Open a companion window">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <path d="M3 9h18"/>
            <path d="M9 21V9"/>
          </svg>
          Spawn Partner Window
        </button>

        <button id="cat-btn" class="btn btn-cat" title="Toggle Cosmic Cat Constellation">
          🐱 Cat Shape
        </button>

        <button id="sound-btn" class="btn btn-icon" title="Toggle Synthesizer Sound">
          <svg id="sound-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
      </div>

      <p class="hint-text">
        Drag windows close together to charge the collision meter and unlock the Cosmic Cat!
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
