<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celestial Collision</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%233b82f6'/></svg>" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div class="hud-header">
      <span class="title">Celestial Collision</span>
      <div class="divider"></div>
      <div class="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">1/2 Celestial Cores (Solo Orbit)</span>
      </div>
    </div>

    <div class="metrics-overlay" id="metrics-overlay">
      <span>DIST: <strong id="dist-val">0</strong> PX</span>
      <span>TENSION: <strong id="tension-val">0</strong> AU</span>
      <span>
        COLLISION: <strong id="energy-val">0</strong>%
        <span class="collision-bar-wrap">
          <span class="collision-bar-fill" id="collision-bar"></span>
        </span>
      </span>
    </div>

    <div class="cat-toast" id="cat-toast">
      Cosmic Cat Constellation Active
    </div>

    <div class="hud-footer">
      <div class="controls-row">
        <div class="palette-picker" id="palette-picker" title="Change Palette"></div>

        <button id="spawn-btn" class="btn btn-primary" title="Open companion window">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <path d="M3 9h18"/>
            <path d="M9 21V9"/>
          </svg>
          Spawn Partner Window
        </button>

        <button id="sound-btn" class="btn btn-icon" title="Toggle Audio">
          <svg id="sound-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
      </div>

      <p class="hint-text">
        Collide or overlap windows to charge collision energy and trigger the cat constellation
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
